name: Backup Database

# Daily snapshot of the production SQLite db, published as a GitHub Release
# asset. No S3 bucket, no permanent SSH key: an ephemeral keypair is
# authorized just long enough to scp the file off the box over an SSM
# port-forward tunnel (never touches the public internet or the security
# group), then revoked. Only the last 14 backups are kept.

on:
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install the SSM Session Manager plugin
        run: |
          curl -sS "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb

      - name: Generate an ephemeral SSH key and authorize it on the instance
        run: |
          ssh-keygen -t ed25519 -N "" -C "ephemeral-backup-key" -f /tmp/backup_key -q
          PUBKEY=$(cat /tmp/backup_key.pub)
          python3 - "$PUBKEY" <<'PYEOF'
          import json, sys
          pubkey = sys.argv[1]
          commands = [f"echo '{pubkey}' >> /home/ec2-user/.ssh/authorized_keys"]
          with open("auth_params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PYEOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://auth_params.json \
            --query "Command.CommandId" --output text)
          STATUS="Pending"
          for i in $(seq 1 15); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 3
          done
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Failed to authorize the ephemeral backup key (status: $STATUS)"
            exit 1
          fi

      - name: Open an SSM port-forward tunnel to port 22
        run: |
          aws ssm start-session \
            --target "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["22"],"localPortNumber":["2222"]}' &
          echo $! > /tmp/tunnel.pid
          for i in $(seq 1 15); do
            (echo > /dev/tcp/127.0.0.1/2222) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Copy the database over the tunnel
        run: |
          mkdir -p backup
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i /tmp/backup_key -P 2222 \
            ec2-user@127.0.0.1:/opt/seo-automation/data/seo_automation.db \
            "backup/seo_automation-$(date +%F).db"

      - name: Close the tunnel and revoke the ephemeral key
        if: always()
        run: |
          kill "$(cat /tmp/tunnel.pid)" 2>/dev/null || true
          python3 - <<'PYEOF'
          import json
          commands = ["sed -i '/ephemeral-backup-key/d' /home/ec2-user/.ssh/authorized_keys || true"]
          with open("revoke_params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PYEOF
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://revoke_params.json \
            --query "Command.CommandId" --output text

      - name: Publish the backup as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="db-backup-$(date +%F)"
          gh release create "$TAG" "backup/seo_automation-$(date +%F).db" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Automated daily backup of seo_automation.db"

      - name: Keep only the last 14 backups
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("db-backup-"))] | sort_by(.createdAt) | reverse | .[14:] | .[].tagName' \
          | while read -r OLD_TAG; do
              [ -n "$OLD_TAG" ] || continue
              echo "Deleting old backup: $OLD_TAG"
              gh release delete "$OLD_TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
            done
