services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seofixai}
      POSTGRES_USER: ${POSTGRES_USER:-seofixai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seofixai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: seofixai-app
    build: .
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-seofixai}:${POSTGRES_PASSWORD:-seofixai}@postgres:5432/${POSTGRES_DB:-seofixai}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data:
