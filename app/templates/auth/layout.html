<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SeoFixAI{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center p-4">
  <main class="w-full max-w-sm">
    <h1 class="text-xl font-semibold mb-1">SeoFixAI{% if portal == "admin" %} <span class="text-indigo-600">Admin</span>{% endif %}</h1>
    <p class="text-sm text-slate-500 mb-6">{% block subtitle %}{% endblock %}</p>
    {% if error %}
    <div role="alert" class="mb-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</div>
    {% endif %}
    <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
      {% block body %}{% endblock %}
    </div>
    <p class="mt-4 text-center text-sm text-slate-500">{% block footer %}{% endblock %}</p>
  </main>
</body>
</html>
